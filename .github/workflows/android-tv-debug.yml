name: Android TV Debug APK

# 电视端调试包的出包口。
#
# 为什么单独一支 workflow，而不是复用 android-release.yml：
#   · release 包的签名是可选的 —— 没配 keystore secrets 时打出来的是**未签名**包，
#     装不上真机/电视（INSTALL_PARSE_FAILED_NO_CERTIFICATES）。电视适配阶段每次都去
#     管 keystore 是纯粹的摩擦。
#   · debug 包由 AGP 用调试密钥自动签名，adb install 直接能装。
#   · 不改 release 那条路：它还要验签名证书指纹、发 Release，不该被调试包污染。
#
# 触发：
#   · 推 feat/tv* —— 改完就出包，不用去 Actions 页找按钮（fork 里那个下拉框经常找不到分支）；
#   · 手动 workflow_dispatch —— 保底入口。
# 产物是 app-debug.apk，在该次运行页底部的 Artifacts 里下载。

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/tv'
      - 'feat/tv-*'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # 这棵树的 vite 构建在默认堆上限下偶发 OOM（CI runner 7GB）。
      NODE_OPTIONS: --max-old-space-size=6144
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-ubuntu-latest-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # Capacitor 8 的 android 库以 source/target 21 编译，JDK 17 会报「无效的源发行版：21」。
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 一条命令两件事：vite build（FOLIA_BUILD_TARGET=capacitor）+ cap sync android。
      # 只 build 不同步，打进包里的还是上一版前端。
      - name: Build web assets and sync to Android
        run: npm run cap:sync:android

      # 固定签名：配了 secrets 就用同一把钥匙签调试包，于是后续版本能直接覆盖升级
      # （CI 每次临时生成的调试密钥都不一样，会导致每装一次都要先卸载、数据全清）。
      # 没配也不 fail，只是会警告，仍用 AGP 自动生成的调试密钥。
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::warning::没配 ANDROID_KEYSTORE_BASE64 —— 本次用 CI 临时调试密钥，装到设备上要先卸载旧包"
            exit 0
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > android/folia-tv.jks
          test -s android/folia-tv.jks || { echo "::error::keystore 解出来是空的（base64 不对？）"; exit 1; }
          # storeFile 相对 **app 模块** 目录解析（app/build.gradle 里的 file()），所以是 ../folia-tv.jks。
          cat > android/keystore.properties <<EOF
          storeFile=../folia-tv.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          keytool -list -keystore android/folia-tv.jks -storepass "${KEYSTORE_PASSWORD}" -alias "${KEY_ALIAS}" >/dev/null \
            || { echo "::error::keystore 口令或 alias 与 secrets 不符"; exit 1; }
          echo "签名配置已写入（调试包也会用这把钥匙）"

      - name: Build debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Report APK signer
        # 把签名证书指纹写进日志：以后判断「这个包能不能覆盖上一个」全靠它。
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "${APKSIGNER}" verify --print-certs "$APK" | grep -i 'certificate SHA-256 digest' | head -1

      - name: Remove signing material from the workspace
        if: always()
        run: rm -f android/folia-tv.jks android/keystore.properties

      - name: Verify packaged web assets
        # 与 release 同一条断言：资产没进包时 gradle 照样绿，只有装机才发现是旧界面。
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "没有产出 APK"; exit 1; }
          unzip -l "$APK" | grep -qE "assets/public/index\.html" \
            || { echo "Web 产物没进包 —— 大概率是 cap sync 没跑"; exit 1; }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: folia-tv-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
